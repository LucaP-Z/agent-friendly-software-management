[project]
name = "afsp"
version = "0.1.0"
description = "Agent-friendly software management: design/spec platform backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "ruamel.yaml>=0.18",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
