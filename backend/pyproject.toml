[project]
name = "afsp"
version = "0.1.0"
description = "Agent-friendly software management: design/spec platform backend"
license = "CC-BY-NC-4.0"
license-files = ["../LICENSE"]
authors = [{ name = "Luca Panossian-Zorab" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "ruamel.yaml>=0.18",
]

[project.urls]
Repository = "https://github.com/LucaP-Z/agent-friendly-software-management"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
